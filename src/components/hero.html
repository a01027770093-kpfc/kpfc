<script>
(function() {
    const counters = document.querySelectorAll('.hero-section .count-up');
    const speed = 2000;

    const startCounting = (counter) => {
        const target = parseFloat(counter.getAttribute('data-count'));
        const suffix = counter.getAttribute('data-suffix') || '';
        const hasDecimal = counter.getAttribute('data-decimal');
        const increment = target / (speed / 16);
        let current = 0;

        const updateCounter = () => {
            current += increment;
            if (current < target) {
                counter.textContent = (hasDecimal ? current.toFixed(1) : Math.floor(current)) + suffix;
                requestAnimationFrame(updateCounter);
            } else {
                counter.textContent = (hasDecimal ? target.toFixed(1) : target) + suffix;
            }
        };
        updateCounter();
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const counter = entry.target;
                if (counter.textContent === '0%' || counter.textContent === '0') {
                    startCounting(counter);
                }
            }
        });
    }, { threshold: 0.5 });

    counters.forEach(counter => observer.observe(counter));
})();
</script>
